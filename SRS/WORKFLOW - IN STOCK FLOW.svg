<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2650" width="1100" height="2650" style="background: #fbffe5; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a" />
    </marker>
    <marker id="arr-p" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea" />
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
    </marker>
    <filter id="sh" x="-4%" y="-4%" width="112%" height="112%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="gp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/><stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/><stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/><stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/><stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- TITLE -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">WORKFLOW 1 — In-Stock Dispatch Flow (Real Data)</text>
  <text x="550" y="60" text-anchor="middle" font-size="12" fill="#64748b">Customer: Raj Printers Pvt Ltd  |  SO-2024-001  |  ITC FBB 300 GSM 23x36  |  8,000 KG</text>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- STEP 1: INQUIRY & SALES ORDER -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <text x="550" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">─── STEP 1: Inquiry &amp; Order Entry ───</text>

  <!-- Inquiry -->
  <rect x="325" y="115" width="450" height="85" rx="10" fill="url(#gb)" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <text x="550" y="137" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Customer Inquiry Received</text>
  <text x="550" y="155" text-anchor="middle" font-size="11" fill="#3b82f6">/inquiry</text>
  <line x1="340" y1="168" x2="760" y2="168" stroke="#dbeafe" stroke-width="1"/>
  <text x="350" y="185" font-size="11" fill="#475569">Customer: <tspan font-weight="bold">Raj Printers Pvt Ltd</tspan> (Raj Kumar)  |  Indore</text>
  <text x="350" y="195" font-size="10" fill="#64748b">Need: ITC FBB 300 GSM, 23x36 Sheet — 8,000 KG  |  Delivery by 25-Jan-2024</text>

  <line x1="550" y1="200" x2="550" y2="225" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stock Check (process step) -->
  <rect x="350" y="230" width="400" height="35" rx="17" fill="url(#gt)" stroke="#0d9488" stroke-width="1.5"/>
  <text x="550" y="252" text-anchor="middle" font-size="11" fill="#0f766e">Salesman checks In-House Stock → 10,000 KG available in Lasudia Godown ✓</text>

  <line x1="550" y1="265" x2="550" y2="290" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Sales Order Created -->
  <rect x="275" y="295" width="550" height="120" rx="10" fill="url(#gb)" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <text x="550" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Sales Order Created</text>
  <text x="550" y="335" text-anchor="middle" font-size="11" fill="#3b82f6">/orders → Create New Order</text>
  <line x1="290" y1="345" x2="810" y2="345" stroke="#dbeafe" stroke-width="1"/>
  <text x="300" y="362" font-size="11" fill="#475569"><tspan font-weight="bold">SO-2024-001</tspan>  |  Date: 10-Jan-2024  |  Salesman: Ramesh Gupta</text>
  <text x="300" y="378" font-size="11" fill="#475569">Material: ITC/FBB/300/23x36/Sheet  |  Qty: 8,000 KG  |  Rate: ₹92/KG</text>
  <text x="300" y="394" font-size="11" fill="#475569">Total: <tspan font-weight="bold" fill="#1e40af">₹7,36,000</tspan>  |  Delivery: 123 Industrial Area, Indore</text>
  <text x="300" y="408" font-size="10" fill="#64748b">Customer PO uploaded → AI auto-populated → Internal checkpoints validated → Confirmed</text>

  <line x1="550" y1="415" x2="550" y2="445" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- STEP 2: COVERAGE CHECK -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <text x="550" y="465" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">─── STEP 2: Coverage Check ───</text>

  <rect x="300" y="480" width="500" height="95" rx="10" fill="url(#ga)" stroke="#d97706" stroke-width="2" filter="url(#sh)"/>
  <text x="550" y="502" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Stock Available? → YES ✓</text>
  <text x="550" y="520" text-anchor="middle" font-size="11" fill="#b45309">/coverage</text>
  <line x1="315" y1="530" x2="785" y2="530" stroke="#fef3c7" stroke-width="1"/>
  <text x="320" y="547" font-size="11" fill="#475569">LOT-2024-001: ITC FBB 300 GSM 23x36 → <tspan font-weight="bold" fill="#16a34a">10,000 KG in stock</tspan></text>
  <text x="320" y="563" font-size="11" fill="#475569">Bin: Lasudia-A-1-A1  |  Coverage: 125% (10,000 / 8,000)  |  A Grade</text>
  <rect x="680" y="536" width="95" height="22" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="727" y="551" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">ALLOCATED</text>

  <line x1="550" y1="575" x2="550" y2="605" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- STEP 3: DISPATCH PLANNING -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <text x="550" y="625" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">─── STEP 3: Dispatch Planning ───</text>

  <!-- Dispatch Queue -->
  <rect x="300" y="640" width="500" height="80" rx="10" fill="url(#gp)" stroke="#9333ea" stroke-width="2" filter="url(#sh)"/>
  <text x="550" y="662" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b21a8">Enters Dispatch Planner Queue</text>
  <text x="550" y="680" text-anchor="middle" font-size="11" fill="#9333ea">/dispatch-queue</text>
  <line x1="315" y1="690" x2="785" y2="690" stroke="#f3e8ff" stroke-width="1"/>
  <text x="320" y="707" font-size="11" fill="#475569">SO-2024-001 → Raj Printers → 8,000 KG FBB 300  |  Due: 25-Jan-2024</text>

  <line x1="550" y1="720" x2="550" y2="750" stroke="#9333ea" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Pick Plan -->
  <rect x="275" y="755" width="550" height="110" rx="10" fill="url(#gg)" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
  <text x="550" y="777" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Bin-wise FIFO Pick Plan Created</text>
  <text x="550" y="795" text-anchor="middle" font-size="11" fill="#16a34a">/pick-plan</text>
  <line x1="290" y1="805" x2="810" y2="805" stroke="#dcfce7" stroke-width="1"/>
  <text x="300" y="822" font-size="11" fill="#475569"><tspan font-weight="bold">PICK-2024-001</tspan>  |  Created: 11-Jan-2024  |  Planned Pick: 24-Jan-2024</text>
  <text x="300" y="838" font-size="11" fill="#475569">Warehouse: Lasudia  |  Lot: LOT-2024-001  |  Bin: Lasudia-A-1-A1</text>
  <text x="300" y="854" font-size="11" fill="#475569">Pick Qty: 8,000 KG  |  Assigned: Warehouse Team A  |  FIFO Sequence: #1</text>

  <line x1="550" y1="865" x2="550" y2="895" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- STEP 4: CHALLAN & LOADING -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <text x="550" y="915" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">─── STEP 4: Challan &amp; Loading ───</text>

  <rect x="250" y="930" width="600" height="150" rx="10" fill="url(#gp)" stroke="#9333ea" stroke-width="2" filter="url(#sh)"/>
  <text x="550" y="952" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b21a8">Challan Generated &amp; Store Pick + Loading</text>
  <text x="550" y="970" text-anchor="middle" font-size="11" fill="#9333ea">/challan  +  /truck-load-plan</text>
  <line x1="265" y1="980" x2="835" y2="980" stroke="#f3e8ff" stroke-width="1"/>
  <text x="270" y="997" font-size="11" fill="#475569"><tspan font-weight="bold">CH-2024-001</tspan>  |  Date: 24-Jan-2024  |  TLP: TLP-2024-001</text>
  <text x="270" y="1013" font-size="11" fill="#475569">Truck: <tspan font-weight="bold">MP09AB1234</tspan>  |  Driver: Rajesh Sharma (+91-9876501111)</text>
  <text x="270" y="1029" font-size="11" fill="#475569">Transporter: Shree Maruti Courier  |  Transport Cost: ₹4,500</text>
  <text x="270" y="1045" font-size="11" fill="#475569">Bundles: 16  |  Weight: 4,800 KG  |  Loading: 09:00 → 10:30</text>
  <text x="270" y="1061" font-size="11" fill="#475569">LR: LR-2024-0051  |  eWay Bill: EWB-331200045678</text>
  <rect x="700" y="1050" width="130" height="22" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1"/>
  <text x="765" y="1065" text-anchor="middle" font-size="10" font-weight="bold" fill="#9333ea">GATE OUT: 10:45</text>

  <line x1="550" y1="1080" x2="550" y2="1115" stroke="#9333ea" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- STEP 5: SALES INVOICE -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <text x="550" y="1135" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">─── STEP 5: Sales Invoice ───</text>

  <rect x="250" y="1150" width="600" height="140" rx="10" fill="url(#gr)" stroke="#dc2626" stroke-width="2" filter="url(#sh)"/>
  <text x="550" y="1172" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Sales Invoice Generated</text>
  <text x="550" y="1190" text-anchor="middle" font-size="11" fill="#dc2626">/sales-invoices</text>
  <line x1="265" y1="1200" x2="835" y2="1200" stroke="#fee2e2" stroke-width="1"/>
  <text x="270" y="1217" font-size="11" fill="#475569"><tspan font-weight="bold">INV-2024-001</tspan>  |  Date: 24-Jan-2024  |  GST: 23AABCR1234A1Z5</text>
  <text x="270" y="1233" font-size="11" fill="#475569">Material: FBB White Back 300 GSM 23x36  |  Qty: 8,000 KG  |  Rate: ₹110/KG</text>
  <text x="270" y="1249" font-size="11" fill="#475569">Base: ₹8,80,000  |  CGST 9%: ₹79,200  |  SGST 9%: ₹79,200</text>
  <text x="270" y="1265" font-size="11" fill="#475569">Total: <tspan font-weight="bold" fill="#dc2626">₹10,38,400</tspan>  |  Due: 24-Feb-2024</text>
  <rect x="700" y="1260" width="120" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="760" y="1275" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">ISSUED</text>

  <line x1="550" y1="1290" x2="550" y2="1325" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r)"/>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- STEP 6: TRUCK DISPATCH & IN-TRANSIT -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <text x="550" y="1345" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">─── STEP 6: Truck Dispatch &amp; In-Transit ───</text>

  <rect x="250" y="1360" width="600" height="105" rx="10" fill="url(#gp)" stroke="#9333ea" stroke-width="2" filter="url(#sh)"/>
  <text x="550" y="1382" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b21a8">Truck Dispatch — In Transit to Customer</text>
  <text x="550" y="1400" text-anchor="middle" font-size="11" fill="#9333ea">/in-transit</text>
  <line x1="265" y1="1410" x2="835" y2="1410" stroke="#f3e8ff" stroke-width="1"/>
  <text x="270" y="1427" font-size="11" fill="#475569"><tspan font-weight="bold">TRK-2024-001</tspan>  |  Truck: MP09AB1234  |  Mode: Direct To Customer</text>
  <text x="270" y="1443" font-size="11" fill="#475569">Lasudia Godown, Indore → Raj Printers, Industrial Area, Indore</text>
  <text x="270" y="1459" font-size="10" fill="#64748b">Carrying: Sales Invoice INV-2024-001 (3 copies) + Challan CH-2024-001</text>

  <line x1="550" y1="1465" x2="550" y2="1500" stroke="#9333ea" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Timeline -->
  <rect x="250" y="1505" width="600" height="140" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="270" y="1527" font-size="12" font-weight="bold" fill="#475569">Live Tracking Updates</text>
  <line x1="265" y1="1535" x2="835" y2="1535" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Timeline dots and text -->
  <circle cx="290" cy="1558" r="6" fill="#3b82f6"/>
  <text x="310" y="1555" font-size="11" font-weight="bold" fill="#475569">10:30 — Lasudia Godown</text>
  <text x="310" y="1568" font-size="10" fill="#64748b">Loaded and dispatched</text>

  <circle cx="290" cy="1588" r="6" fill="#8b5cf6"/>
  <text x="310" y="1585" font-size="11" font-weight="bold" fill="#475569">11:15 — AB Road</text>
  <text x="310" y="1598" font-size="10" fill="#64748b">In transit — moving towards destination</text>

  <circle cx="290" cy="1618" r="6" fill="#f59e0b"/>
  <text x="310" y="1615" font-size="11" font-weight="bold" fill="#475569">12:00 — Industrial Area</text>
  <text x="310" y="1628" font-size="10" fill="#64748b">Reached destination area</text>

  <circle cx="290" cy="1638" r="6" fill="#16a34a"/>
  <text x="310" y="1640" font-size="11" font-weight="bold" fill="#16a34a">12:45 — Raj Printers</text>
  <text x="310" y="1640" font-size="10" fill="#64748b" dx="300">Delivered &amp; signed by customer</text>

  <!-- connecting line between dots -->
  <line x1="290" y1="1564" x2="290" y2="1632" stroke="#e2e8f0" stroke-width="2"/>

  <line x1="550" y1="1645" x2="550" y2="1680" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- STEP 7: DELIVERY CONFIRMATION -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <text x="550" y="1700" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">─── STEP 7: Delivery Confirmation ───</text>

  <rect x="300" y="1715" width="500" height="80" rx="10" fill="url(#gp)" stroke="#9333ea" stroke-width="2" filter="url(#sh)"/>
  <text x="550" y="1737" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b21a8">Delivery Confirmation + POD</text>
  <text x="550" y="1755" text-anchor="middle" font-size="11" fill="#9333ea">/in-transit → Update Status</text>
  <line x1="315" y1="1765" x2="785" y2="1765" stroke="#f3e8ff" stroke-width="1"/>
  <text x="320" y="1782" font-size="11" fill="#475569">POD captured  |  LR updated  |  Customer signed  |  12:45 PM, 24-Jan-2024</text>

  <line x1="550" y1="1795" x2="550" y2="1830" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- STEP 8: PAYMENT -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <text x="550" y="1850" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">─── STEP 8: Payment Collection ───</text>

  <rect x="300" y="1865" width="500" height="80" rx="10" fill="url(#gr)" stroke="#dc2626" stroke-width="2" filter="url(#sh)"/>
  <text x="550" y="1887" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Payment Tracking</text>
  <text x="550" y="1905" text-anchor="middle" font-size="11" fill="#dc2626">/payments</text>
  <line x1="315" y1="1915" x2="785" y2="1915" stroke="#fee2e2" stroke-width="1"/>
  <text x="320" y="1932" font-size="11" fill="#475569">Invoice: ₹10,38,400  |  Received: <tspan font-weight="bold" fill="#16a34a">₹5,00,000</tspan>  |  Balance: <tspan font-weight="bold" fill="#dc2626">₹5,38,400</tspan>  |  Due: 24-Feb</text>

  <line x1="550" y1="1945" x2="550" y2="1980" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- COMPLETED -->
  <rect x="440" y="1985" width="220" height="45" rx="22" fill="#16a34a" stroke="#166534" stroke-width="2" filter="url(#sh)"/>
  <text x="550" y="2014" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">ORDER DELIVERED ✓</text>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- STOCK IMPACT SUMMARY -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <rect x="200" y="2070" width="700" height="130" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
  <text x="550" y="2095" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Stock Impact Summary</text>
  <line x1="220" y1="2105" x2="880" y2="2105" stroke="#dcfce7" stroke-width="1"/>

  <text x="240" y="2128" font-size="12" fill="#475569">LOT-2024-001 (Bin: Lasudia-A-1-A1)</text>
  <text x="240" y="2148" font-size="12" fill="#475569">Before:  Total = 10,000 KG  |  Allocated = 0 KG  |  Available = 10,000 KG</text>
  <text x="240" y="2168" font-size="12" font-weight="bold" fill="#166534">After:    Total = 10,000 KG  |  Allocated = 8,000 KG  |  Available = 2,000 KG</text>
  <text x="240" y="2188" font-size="11" fill="#64748b">Remaining 2,000 KG available for next FIFO allocation</text>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- KEY DATA TRAIL -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <rect x="200" y="2230" width="700" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <text x="550" y="2255" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Complete Data Trail</text>
  <line x1="220" y1="2265" x2="880" y2="2265" stroke="#dbeafe" stroke-width="1"/>

  <text x="240" y="2288" font-size="11" fill="#475569">Inquiry → <tspan font-weight="bold">SO-2024-001</tspan> → Coverage ✓ → <tspan font-weight="bold">PICK-2024-001</tspan> → <tspan font-weight="bold">CH-2024-001</tspan></text>
  <text x="240" y="2308" font-size="11" fill="#475569">→ <tspan font-weight="bold">TLP-2024-001</tspan> → <tspan font-weight="bold">INV-2024-001</tspan> → <tspan font-weight="bold">TRK-2024-001</tspan> → Delivered</text>
  <text x="240" y="2335" font-size="11" fill="#64748b">Truck: MP09AB1234  |  LR: LR-2024-0051  |  eWay: EWB-331200045678</text>
  <text x="240" y="2355" font-size="11" fill="#64748b">Tally Sync: TV-2024-001 (synced 25-Jan-2024)  |  Payment: Partially Paid</text>

  <!-- FOOTER -->
  <text x="550" y="2410" text-anchor="middle" font-size="11" fill="#94a3b8">Monit Paper Agency ERP — In-Stock Dispatch Workflow (Real Data)</text>
  <text x="550" y="2428" text-anchor="middle" font-size="10" fill="#cbd5e1">Blue = Sales  |  Green = Inventory  |  Purple = Dispatch  |  Red = Finance  |  Teal = Process Step</text>

</svg>
